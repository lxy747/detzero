SUPER_CLASS_NAMES: ['other']
CLASS_NAMES: ["bicycle ","pedestrian", "traffic_cone"]

DATA_CONFIG:
    _BASE_CONFIG_: ../ref_dataset_cfgs/motovis_grm_dataset.yaml

MODEL:
    NAME: GeometryRefineModel
    QUERY_POINT_DIMS: 10
    MEMORY_POINT_DIMS: 3

    REGRESSION:
        NAME: GeometryTransformer
        QUERY_ENCODER: [128, 128]
        MEMORY_ENCODER: [128, 128]
        REGRESSION_MLP: [512]
        EMBED_DIMS: 256
        ANCHOR_SIZES: [[1.7, 0.7, 1.5], [0.68, 0.68, 1.6], [0.38, 0.38, 0.74]]

        DECODER: 
            NAME: GeometryHead
            num_classes: 3
            num_heads: 8
            num_decoder_layers: 1
            
            auxiliary: True
            cross_only: False
            memory_self_attn: False

            hidden_channel: 256
            ffn_channel: 256
            dropout: 0.1
            bn_momentum: 0.1
            activation: relu

    POST_PROCESSING:
        GENERATE_RECALL: True
        RECALL_THRESH_LIST: [0.5]

OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 128
    NUM_EPOCHS: 500

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.9, 0.8]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [35, 45]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 0.1
